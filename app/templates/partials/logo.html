{#- The Attic mark: a small house with a pitched roof and a round attic window.
    It is drawn with currentColor so it takes on the primary accent. -#}
{% macro logo(size=28) -%}
<svg class="logo" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" role="img" aria-label="Attic">
  <path d="M16 3.3 3.6 14.2h3.1V28h18.6V14.2h3.1z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="16" cy="17.6" r="4.4" stroke="currentColor" stroke-width="2.2"/>
  <path d="M16 13.2v8.8M11.6 17.6h8.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
</svg>
{%- endmacro %}
